# Host nginx config for the Butler appointment-scheduler stack.
#
# This file is shipped to /etc/nginx/conf.d/appointment-scheduler.conf by
# deploy/deploy-source-build.sh on every deploy. Edit it here, not in-place
# on the server — otherwise the next deploy silently reverts your edits.
#
# Server name strategy:
#   - app.hey-alfred.vip  → primary HTTPS, Let's Encrypt cert. This is the
#                            URL extension's host_permissions trust list.
#   - hey-alfred.vip      → 301 → app subdomain (so bookmarks for the bare
#                            apex still work).
#   - 47.236.98.146       → legacy fallback HTTPS with self-signed cert,
#                            kept so existing bookmarks / installed
#                            extensions don't 404 during the migration window.
#                            Will be removed once everyone is on the domain.
#
# ACME challenge:
#   /var/www/letsencrypt is the webroot used by certbot for the auto-renew
#   timer (installed by `certbot certonly --webroot -w /var/www/letsencrypt
#   -d app.hey-alfred.vip -d hey-alfred.vip` on 2026-06-01). We match it on
#   port 80 BEFORE the 301 so renewals don't get redirected.

# ─── HTTP — ACME challenge + 301 to https ──────────────────────────────────
server {
    listen 80;
    server_name app.hey-alfred.vip hey-alfred.vip 47.236.98.146 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS — primary public hostname (real Let's Encrypt cert) ────────────
server {
    listen 443 ssl http2;
    server_name app.hey-alfred.vip;

    ssl_certificate     /etc/letsencrypt/live/app.hey-alfred.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hey-alfred.vip/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}

# ─── HTTPS — bare apex 301 → app subdomain ─────────────────────────────────
server {
    listen 443 ssl http2;
    server_name hey-alfred.vip;

    ssl_certificate     /etc/letsencrypt/live/app.hey-alfred.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.hey-alfred.vip/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://app.hey-alfred.vip$request_uri;
}

# ─── HTTPS — legacy IP fallback (self-signed) ─────────────────────────────
# Kept temporarily so existing bookmarks and installed extension v1.0.3
# (whose host_permissions don't yet include hey-alfred.vip) keep working.
# Drop this server block once the v1.0.5 extension is widely upgraded.
server {
    listen 443 ssl http2;
    server_name 47.236.98.146 _;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
}
