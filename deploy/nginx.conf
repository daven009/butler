server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        # Hashed asset filenames (e.g. index-DC9SbUh3.js) — safe to cache forever.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA entry: index.html must never stick in browser caches, otherwise users
    # who visited an older deploy will keep loading the old <script src="…">
    # tag pointing at a stale bundle hash. (We hit this on 2026-06-01: returning
    # users from May 14 deploy were still seeing "Bulter Web" until they
    # hard-refreshed. Fix here means future deploys propagate within seconds.)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        # SPA fallback. Same no-cache treatment as /index.html since this branch
        # serves index.html for any unknown path.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }
}
